<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs><clipPath id="c1"><rect x="0" y="0" width="600" height="450" rx="8"/></clipPath></defs>
  <rect x="0" y="0" width="600" height="450" rx="8" fill="#f7fafd" stroke="#b0c8dc" stroke-width="1.2"/>
  <!-- header -->
  <rect x="0" y="0" width="600" height="46" rx="8" fill="#1e3252" clip-path="url(#c1)"/>
  <rect x="0" y="32" width="600" height="14" fill="#1e3252"/>
  <text x="22" y="28" font-size="13" font-weight="600" fill="#ffffff">Cloud Onboarding Setup</text>
  <text x="578" y="28" font-size="16" fill="#7a9ec4" text-anchor="middle">&#215;</text>
  <!-- sidebar -->
  <rect x="0" y="46" width="172" height="404" fill="#dce8f5" clip-path="url(#c1)"/>
  <line x1="172" y1="46" x2="172" y2="450" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="16" y="74" font-size="11" fill="#2d5a8a">Overview</text>
  <text x="16" y="96" font-size="11" fill="#2d5a8a">Configure Management Account</text>
  <!-- active step -->
  <rect x="0" y="106" width="172" height="28" fill="#2d5a8a" clip-path="url(#c1)"/>
  <text x="16" y="124" font-size="11" font-weight="700" fill="#ffffff">Configure Member Accounts</text>
  <text x="16" y="154" font-size="11" fill="#7a9ec4">Select Member Accounts</text>
  <text x="16" y="174" font-size="11" fill="#7a9ec4">Default Account Group</text>
  <text x="16" y="194" font-size="11" fill="#7a9ec4">Status</text>
  <text x="16" y="214" font-size="11" fill="#7a9ec4">Advanced Settings</text>
  <!-- content title -->
  <text x="192" y="76" font-size="14" font-weight="600" fill="#1a2d3e">Configure Member Accounts</text>
  <!-- 13 steps -->
  <text x="208" y="104" font-size="11" fill="#1a2d3e">1.  Download CloudFormation template</text>
  <text x="208" y="122" font-size="11" fill="#1a2d3e">2.  Login to AWS Master Account via AWS console</text>
  <text x="208" y="140" font-size="11" fill="#1a2d3e">3.  Upload template file, provide a StackSet name</text>
  <text x="208" y="158" font-size="11" fill="#1a2d3e">4.  Enter PrismaCloudRoleName and ExternalId values</text>
  <text x="208" y="176" font-size="11" fill="#1a2d3e">5.  Select Service managed permissions</text>
  <text x="208" y="194" font-size="11" fill="#1a2d3e">6.  Deploy to organization under Deployment targets</text>
  <text x="208" y="212" font-size="11" fill="#1a2d3e">7.  Set Automatic deployment to Enabled</text>
  <text x="208" y="230" font-size="11" fill="#1a2d3e">8.  Select any one region under Specify regions</text>
  <text x="208" y="248" font-size="11" fill="#1a2d3e">9.  Set Maximum concurrent accounts &#8594; 100%</text>
  <text x="208" y="266" font-size="11" fill="#1a2d3e">10. Set Failure tolerance &#8594; 100%</text>
  <text x="208" y="284" font-size="11" fill="#1a2d3e">11. Click Next, review the configuration</text>
  <text x="208" y="302" font-size="11" fill="#1a2d3e">12. Acknowledge IAM resource creation and click Submit</text>
  <text x="208" y="320" font-size="11" fill="#7a9ec4">13. Copy PrismaCloudRoleName + ExternalId from Parameters tab</text>
  <!-- form fields -->
  <line x1="182" y1="340" x2="590" y2="340" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="192" y="358" font-size="11" fill="#1a2d3e">&#9679; Member External ID</text>
  <rect x="192" y="364" width="188" height="28" rx="4" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>
  <text x="200" y="382" font-size="10" fill="#7a9ec4">Member External ID</text>
  <text x="398" y="358" font-size="11" fill="#1a2d3e">&#9679; Member Role Name</text>
  <rect x="398" y="364" width="184" height="28" rx="4" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>
  <text x="406" y="382" font-size="10" fill="#7a9ec4">Member Role Name</text>
  <!-- footer -->
  <line x1="0" y1="406" x2="600" y2="406" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="192" y="400" font-size="9.5" fill="#7a9ec4" font-style="italic">Step 3 of 7 &#183; 13 manual sub-steps in this screen alone</text>
  <rect x="446" y="412" width="76" height="28" rx="4" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>
  <text x="484" y="430" font-size="11" fill="#1a2d3e" text-anchor="middle">Previous</text>
  <rect x="530" y="412" width="58" height="28" rx="4" fill="#1e3252"/>
  <text x="559" y="430" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Next</text>
</svg>