  <circle cx="390" cy="514" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="390" y="517" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description (2 lines) -->
  <text x="228" y="532" font-size="10" fill="#7a9ec4">Scan serverless functions for vulnerabilities &amp; compliance risks</text>
