  <rect x="168" y="106" width="278" height="82" rx="6" fill="#dce8f5" stroke="#2d5a8a" stroke-width="1.5"/>
  <circle cx="188" cy="138" r="7" fill="#2d5a8a"/>
  <circle cx="188" cy="138" r="3" fill="#ffffff"/>
  <text x="202" y="134" font-size="11.5" font-weight="700" fill="#1e3252">Organisation</text>
  <rect x="352" y="120" width="84" height="18" rx="9" fill="#ffffff" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="394" y="132" font-size="9" fill="#2d5a8a" text-anchor="middle">Recommended</text>
  <text x="202" y="151" font-size="10" fill="#2d5a8a">Secure your AWS Organisation</text>
  <text x="202" y="164" font-size="10" fill="#2d5a8a">including its member accounts</text>

  <!-- Account card (unselected) -->
  <rect x="458" y="106" width="278" height="82" rx="6" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>
  <circle cx="478" cy="138" r="7" fill="#ffffff" stroke="#b0c8dc" stroke-width="1.5"/>
  <text x="492" y="134" font-size="11.5" font-weight="600" fill="#1a2d3e">Account</text>
  <text x="492" y="151" font-size="10" fill="#7a9ec4">Secure your specific</text>
  <text x="492" y="164" font-size="10" fill="#7a9ec4">AWS account.</text>

  <!-- CAPABILITIES heading -->
  <text x="168" y="210" font-size="12.5" font-weight="600" fill="#1e3252">Security Capabilities and Permissions</text>
