  <!-- Checkbox (checked) -->
  <rect x="182" y="353" width="14" height="14" rx="2" fill="#2d5a8a"/>
  <polyline points="185,360 188,363 196,356" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
