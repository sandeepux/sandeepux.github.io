  <circle cx="364" cy="260" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="364" y="263" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description -->
  <text x="206" y="278" font-size="10" fill="#7a9ec4">Detect misconfigurations, and check compliance.</text>
  <!-- Badge -->
  <rect x="668" y="250" width="56" height="20" rx="10" fill="#f7fafd" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="696" y="263" font-size="9.5" fill="#1a2d3e" text-anchor="middle">Default</text>
  <line x1="169" y1="294" x2="735" y2="294" stroke="#dce8f5" stroke-width="0.8"/>

  <!-- F-Row 2: Identity Security  (y_top=294, h=50, sep=344) -->
  <!-- Type icon: diamond (identity/permissions) -->
  <circle cx="190" cy="310" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <polygon points="190,304 195,310 190,316 185,310" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="206" y="314" font-size="11" font-weight="600" fill="#1a2d3e">Identity Security</text>
  <!-- Info icon after title ("Identity Security" ≈ 96px) -->
  <circle cx="312" cy="310" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="312" y="313" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description -->
  <text x="206" y="328" font-size="10" fill="#7a9ec4">Calculate net effective permissions for identities.</text>
  <!-- Subscribed badge -->
  <rect x="652" y="302" width="72" height="20" rx="10" fill="#1e3252"/>
  <text x="688" y="315" font-size="9.5" fill="#dce8f5" text-anchor="middle">Subscribed</text>
  <line x1="169" y1="344" x2="735" y2="344" stroke="#dce8f5" stroke-width="0.8"/>

