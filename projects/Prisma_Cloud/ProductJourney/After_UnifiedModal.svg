  <text x="246" y="228" font-size="10" fill="#7a9ec4">(Recommended)</text>

  <!-- FOUNDATIONAL BOX: y=236 h=180 bottom=416 -->
  <rect x="168" y="236" width="568" height="180" rx="6" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>

  <!-- F-Row 1: Misconfigurations CSPM  (y_top=244, h=50, sep=294) -->
  <!-- Type icon: upward triangle (expand/CSPM) -->
  <circle cx="190" cy="260" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <polygon points="190,255 186,265 194,265" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="206" y="264" font-size="11" font-weight="600" fill="#1a2d3e">Misconfigurations (CSPM)</text>
