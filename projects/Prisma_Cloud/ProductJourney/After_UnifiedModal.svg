<svg viewBox="0 0 760 730" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <clipPath id="mc"><rect x="0" y="0" width="760" height="730" rx="8"/></clipPath>
  </defs>
  <rect x="0" y="0" width="760" height="730" rx="8" fill="#f7fafd" stroke="#b0c8dc" stroke-width="1.2"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="760" height="44" rx="8" fill="#1e3252" clip-path="url(#mc)"/>
  <rect x="0" y="30" width="760" height="14" fill="#1e3252"/>
  <text x="20" y="27" font-size="13" font-weight="600" fill="#ffffff">Add Cloud Account</text>
  <text x="746" y="27" font-size="16" fill="#7a9ec4">&#215;</text>

  <!-- SIDEBAR -->
  <rect x="0" y="44" width="152" height="686" fill="#dce8f5" clip-path="url(#mc)"/>
  <line x1="152" y1="44" x2="152" y2="730" stroke="#b0c8dc" stroke-width="0.8"/>
  <rect x="0" y="54" width="152" height="34" fill="#2d5a8a"/>
  <text x="16" y="76" font-size="11.5" font-weight="700" fill="#ffffff">Get Started</text>
  <text x="16" y="112" font-size="11" fill="#7a9ec4">Configure Details</text>
  <text x="16" y="140" font-size="11" fill="#7a9ec4">Review Status</text>

  <!-- AWS logo + title -->
  <rect x="168" y="56" width="28" height="22" rx="3" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="182" y="71" font-size="8.5" fill="#2d5a8a" text-anchor="middle" font-weight="700">aws</text>
  <text x="204" y="74" font-size="17" font-weight="600" fill="#1e3252">Get Started</text>

  <!-- SCOPE -->
  <text x="168" y="98" font-size="12.5" font-weight="600" fill="#1e3252">Scope</text>

