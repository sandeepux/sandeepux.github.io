  <line x1="169" y1="498" x2="735" y2="498" stroke="#dce8f5" stroke-width="0.8"/>

  <!-- A-Row 5: Serverless Function Scanning  (y_top=498, h=64, sep=562) -->
  <!-- Checkbox (unchecked) -->
  <rect x="182" y="507" width="14" height="14" rx="2" fill="#ffffff" stroke="#b0c8dc" stroke-width="1.2"/>
  <!-- Type icon: three vertical dots (serverless/functions) -->
  <circle cx="212" cy="514" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <circle cx="212" cy="508" r="1.8" fill="#2d5a8a"/>
  <circle cx="212" cy="514" r="1.8" fill="#2d5a8a"/>
  <circle cx="212" cy="520" r="1.8" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="228" y="518" font-size="11" font-weight="600" fill="#1a2d3e">Serverless Function Scanning</text>
