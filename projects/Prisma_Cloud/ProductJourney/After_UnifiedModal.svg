  <circle cx="306" cy="464" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="306" y="467" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description -->
  <text x="206" y="482" font-size="10" fill="#7a9ec4">Detect network and user threats.</text>
  <!-- Badge -->
  <rect x="668" y="456" width="56" height="20" rx="10" fill="#f7fafd" stroke="#b0c8dc" stroke-width="0.8"/>
