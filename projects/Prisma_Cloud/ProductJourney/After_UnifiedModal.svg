  <circle cx="212" cy="360" r="4" fill="none" stroke="#2d5a8a" stroke-width="1.5"/>
  <circle cx="212" cy="360" r="1.5" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="228" y="364" font-size="11" font-weight="600" fill="#1a2d3e">Agentless Workload Scanning</text>
