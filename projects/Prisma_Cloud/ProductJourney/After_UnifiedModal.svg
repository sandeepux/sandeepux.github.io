  <!-- Type icon: lightning / signal (threat) -->
  <circle cx="190" cy="464" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <polygon points="192,456 187,464 190,464 188,472 193,464 190,464" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="206" y="468" font-size="11" font-weight="600" fill="#1a2d3e">Threat Detection</text>
