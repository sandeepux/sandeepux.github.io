  <!-- Checkbox (unchecked) -->
  <rect x="182" y="571" width="14" height="14" rx="2" fill="#ffffff" stroke="#b0c8dc" stroke-width="1.2"/>
  <!-- Type icon: diamond (agent/protection) -->
  <circle cx="212" cy="578" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <polygon points="212,572 217,578 212,584 207,578" fill="#2d5a8a"/>
  <!-- Title -->
  <text x="228" y="582" font-size="11" font-weight="600" fill="#1a2d3e">Agent based Workload Protection</text>
  <!-- Info icon after title ("Agent based Workload Protection" ≈ 168px) -->
  <circle cx="406" cy="578" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="406" y="581" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description (2 lines) -->
  <text x="228" y="596" font-size="10" fill="#7a9ec4">Enables permissions for Host &amp; Serverless Defender deployments,</text>
  <text x="228" y="609" font-size="10" fill="#7a9ec4">registry scans, and K8S audit.</text>
  <line x1="169" y1="626" x2="735" y2="626" stroke="#dce8f5" stroke-width="0.8"/>

  <!-- A-Row 7: Data Security  (y_top=626, h=50, box-end=684) -->
  <!-- Checkbox (unchecked) -->
  <rect x="182" y="635" width="14" height="14" rx="2" fill="#ffffff" stroke="#b0c8dc" stroke-width="1.2"/>
  <!-- Type icon: stacked squares (data layers) -->
  <circle cx="212" cy="642" r="8" fill="#dce8f5" stroke="#b0c8dc" stroke-width="0.8"/>
  <rect x="208" y="638" width="8" height="4" rx="1" fill="#2d5a8a"/>
  <rect x="208" y="643" width="8" height="4" rx="1" fill="#2d5a8a" opacity="0.6"/>
  <!-- Title -->
  <text x="228" y="646" font-size="11" font-weight="600" fill="#1a2d3e">Data Security</text>
  <!-- Info icon after title ("Data Security" ≈ 72px) -->
  <circle cx="310" cy="642" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="310" y="645" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description -->
  <text x="228" y="660" font-size="10" fill="#7a9ec4">Detect sensitive data, publicly exposed assets and malware.</text>
  <!-- Not Subscribed badge -->
  <rect x="634" y="634" width="90" height="20" rx="10" fill="#f7fafd" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="679" y="647" font-size="9" fill="#7a9ec4" text-anchor="middle">Not Subscribed</text>

  <!-- FOOTER (box bottom=684, line=696) -->
  <line x1="0" y1="696" x2="760" y2="696" stroke="#b0c8dc" stroke-width="0.8"/>
  <text x="20" y="714" font-size="10.5" fill="#7a9ec4">For product documentation please click</text>
