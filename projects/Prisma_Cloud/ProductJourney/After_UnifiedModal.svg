  <text x="222" y="432" font-size="10" fill="#7a9ec4">(Additional Capabilities)</text>

  <!-- ADVANCED BOX: y=440 h=244 bottom=684 -->
  <rect x="168" y="440" width="568" height="244" rx="6" fill="#ffffff" stroke="#b0c8dc" stroke-width="1"/>

