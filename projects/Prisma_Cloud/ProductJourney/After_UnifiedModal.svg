  <circle cx="388" cy="360" r="6" fill="none" stroke="#b0c8dc" stroke-width="1"/><text x="388" y="363" font-size="8" fill="#7a9ec4" text-anchor="middle" font-style="italic">i</text>
  <!-- Description (2 lines) -->
  <text x="228" y="378" font-size="10" fill="#7a9ec4">Scan hosts &amp; containers for vulnerabilities &amp; compliance risks</text>
  <text x="228" y="391" font-size="10" fill="#7a9ec4">without deploying agents.</text>
  <!-- Badge -->
  <rect x="554" y="350" width="170" height="20" rx="10" fill="#f7fafd" stroke="#2d5a8a" stroke-width="0.8"/>
  <text x="639" y="363" font-size="9" fill="#2d5a8a" text-anchor="middle">Requires additional permissions</text>

  <!-- ADVANCED sub-heading -->
